// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    tasks.withType(Javadoc).all { enabled = false }
}

// Coordinates for JitPack. For a multi-module Gradle build JitPack expects
// com.github.<user>.<repo>:<module>:<tag>, and passes the tag as -Pversion.
allprojects {
    group = 'com.github.Toporin.Satochip-Java'
    // version comes from gradle.properties, or from -Pversion=<tag> when JitPack builds a tag
}