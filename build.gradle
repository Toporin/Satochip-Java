// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

subprojects {
    tasks.withType(Javadoc).all { enabled = false }
}

// Coordinates for JitPack. For a multi-module Gradle build JitPack expects
// com.github.<user>.<repo>:<module>:<tag>, and passes the tag as -Pversion.
allprojects {
    group = 'com.github.Toporin.Satochip-Java'
    // version comes from gradle.properties, or from -Pversion=<tag> when JitPack builds a tag
}
