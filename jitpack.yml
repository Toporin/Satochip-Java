# JitPack build configuration.
# JitPack images ship the Android SDK (ANDROID_HOME is set), so satochip-android is built and
# published along with the two JVM modules. The Android Gradle Plugin downloads the SDK platform
# matching compileSdk if the image does not have it.
jdk:
  - openjdk17
install:
  - ./gradlew :satochip-lib:publishToMavenLocal :satochip-desktop:publishToMavenLocal :satochip-android:publishToMavenLocal
